version: "3.8"

services:
  iiko-menu-web:
    build: .
    container_name: iiko_menu_v2
    restart: unless-stopped
    ports:
      - "8282:9000"                    # внешний порт : внутренний порт приложения
    environment:
      - PORT=9000
      - REQUESTS_TIMEOUT=60
    volumes:
      - ./:/app
    dns:
      - 1.1.1.1
      - 8.8.8.8
