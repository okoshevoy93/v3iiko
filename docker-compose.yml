version: "3.8"

services:
  iiko-menu-web:
    build: .
    container_name: iiko_menu_v2
    restart: unless-stopped
    ports:
      - "8282:9000"                    # ← снаружи любой свободный, внутри 9000
    volumes:
      - /volume1/apps/iiko_menu_v2/app:/app
    environment:
      - PORT=9000                      # ← гарантирует, что Flask возьмёт именно 9000
      - REQUESTS_TIMEOUT=60            # ← увеличить таймаут сетевых запросов
    dns:
      - 1.1.1.1
      - 8.8.8.8
